[package]
name = "stagehand"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Installs, updates and starts the show tools (Show Master, Beamweave, Lantern, ...)"
authors = ["Cheter"]
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["native-certs"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
dirs = "6"

[build-dependencies]
winresource = "0.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
